<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f2b">
<title>МУВ — Спорт Москвы рядом с тобой</title>
<style>
  :root{
    --red:#7a1f2b;
    --red-light:#b23a3a;
    --bg:#f5ece7;
    --card:#ffffff;
    --muted:#8a7d78;
    --gold:#c9962c;
    --silver:#9aa0a6;
    --bronze:#a9673a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2320;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}

  #splash{
    position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,#7a1f2b,#4a1219);
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
  .splash-logo{
    width:84px;height:84px;border-radius:22px;background:#fff;color:var(--red);
    display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    animation:pop .7s ease;
  }
  .splash-title{margin-top:18px;font-size:26px;font-weight:800;letter-spacing:2px;animation:fadeUp .8s ease .1s both;}
  .splash-slogan{margin-top:8px;font-size:14px;opacity:.85;animation:fadeUp .8s ease .3s both;}
  .splash-dots{margin-top:26px;display:flex;gap:6px;}
  .splash-dots span{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.35;animation:blink 1.2s infinite;}
  .splash-dots span:nth-child(2){animation-delay:.2s;}
  .splash-dots span:nth-child(3){animation-delay:.4s;}
  @keyframes pop{0%{transform:scale(.6);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes fadeUp{0%{transform:translateY(10px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
  @keyframes blink{0%,100%{opacity:.25;}50%{opacity:1;}}

  .shell{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#2b2320;
  }
  .frame{
    position:relative;width:390px;height:844px;max-height:100vh;
    background:var(--bg);border-radius:46px;overflow:hidden;
    border:10px solid #111; box-shadow:0 30px 70px rgba(0,0,0,.5);
  }
  .frame .island{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);
    width:clamp(84px,28%,118px);height:clamp(22px,6%,28px);
    background:#0b0b0b;border-radius:20px;z-index:60;
  }
  .scroll-area{
    position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-top:44px;padding-bottom:96px;scrollbar-width:none;
  }
  .scroll-area::-webkit-scrollbar{display:none;}

  @media (max-width:700px){
    html,body{overflow:hidden;}
    .shell{background:var(--bg);}
    .frame{
      width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none;
    }
    .frame .island{display:none;}
    .scroll-area{padding-top:max(14px, env(safe-area-inset-top));padding-bottom:calc(90px + env(safe-area-inset-bottom));}
  }

  .app-header{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 14px;}
  .app-header .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{width:46px;height:46px;border-radius:14px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;}
  .brand .titles h1{margin:0;font-size:19px;color:#2b2320;}
  .brand .titles p{margin:0;font-size:12px;color:var(--muted);}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;position:relative;}
  .avatar::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:#4caf50;border:2px solid var(--bg);}

  section{padding:6px 18px 4px;}
  .section-title{font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:700;margin:10px 0 10px;text-transform:uppercase;}

  .cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:9px 16px;border-radius:20px;background:#fff;border:1px solid #eadfd8;font-size:13px;color:#5a4f49;font-weight:600;white-space:nowrap;cursor:pointer;}
  .chip.active{background:var(--red);color:#fff;border-color:var(--red);}

  .mini-cal{background:#fff;border-radius:18px;padding:14px 14px 10px;box-shadow:0 6px 18px rgba(0,0,0,.05);}
  .mini-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .mini-cal-head b{font-size:14px;color:#2b2320;text-transform:capitalize;}
  .mini-cal-nav{display:flex;gap:6px;}
  .mini-cal-nav button{width:26px;height:26px;border-radius:50%;border:none;background:#f4ece7;color:var(--red);font-weight:700;cursor:pointer;}
  .mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .mini-cal-grid .dow{font-size:10px;color:var(--muted);font-weight:700;padding-bottom:4px;}
  .mini-cal-day{position:relative;font-size:12px;padding:6px 0;border-radius:10px;color:#3c332f;cursor:pointer;}
  .mini-cal-day.empty{visibility:hidden;}
  .mini-cal-day.today{border:1px solid var(--red);font-weight:700;}
  .mini-cal-day .dot{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--red);}
  .mini-cal-day.has-event{background:#fbeceb;color:var(--red);font-weight:700;}
  .mini-cal-empty{font-size:12px;color:var(--muted);text-align:center;padding:10px 0 2px;}

  .events-list{display:flex;flex-direction:column;gap:16px;padding-top:6px;}
  .card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.06);}
  .card-cover{position:relative;height:120px;display:flex;align-items:flex-start;justify-content:space-between;padding:12px;color:#fff;}
  .card-cover .tag{background:rgba(255,255,255,.25);backdrop-filter:blur(4px);padding:5px 12px;border-radius:14px;font-size:12px;font-weight:700;}
  .card-cover .date{background:rgba(0,0,0,.35);padding:5px 12px;border-radius:14px;font-size:12px;font-weight:700;}
  .card-body{padding:14px 16px 16px;}
  .card-body h3{margin:0 0 6px;font-size:16px;color:#2b2320;}
  .card-loc{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;align-items:center;}
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .mini-tag{background:#f4ece7;color:#7a5f52;font-size:11.5px;padding:5px 10px;border-radius:10px;font-weight:600;}
  .card-actions{display:flex;gap:8px;}
  .btn-primary{flex:1;background:var(--red);color:#fff;border:none;border-radius:14px;padding:13px;font-weight:700;font-size:14.5px;cursor:pointer;}
  .btn-primary.done{background:#2f9e52;}
  .btn-icon{width:46px;height:46px;border-radius:14px;border:none;background:#f4ece7;color:var(--red);font-size:16px;cursor:pointer;}
  .btn-cal{width:46px;height:46px;border-radius:14px;border:none;background:#eef4ea;color:#2f9e52;font-size:16px;cursor:pointer;}
  .demo-note{font-size:10.5px;color:var(--muted);margin-top:8px;font-style:italic;}

  .bottom-nav{
    position:absolute;left:14px;right:14px;bottom:14px;height:66px;border-radius:26px;
    background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    box-shadow:0 10px 30px rgba(0,0,0,.15),inset 0 0 0 1px rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:space-around;z-index:40;
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;flex:1;}
  .nav-item .ico{font-size:19px;}
  .nav-item.active{color:var(--red);}

  .page{display:none;}
  .page.active{display:block;}

  .profile-head{display:flex;flex-direction:column;align-items:center;padding:12px 0 6px;}
  .profile-avatar{width:76px;height:76px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:10px;}
  .level-badge{padding:6px 14px;border-radius:14px;font-size:12.5px;font-weight:700;color:#fff;margin-top:4px;}
  .level-bronze{background:var(--bronze);} .level-silver{background:var(--silver);} .level-gold{background:var(--gold);}
  .stats-row{display:flex;gap:10px;margin:14px 0;}
  .stat{flex:1;background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.05);}
  .stat b{display:block;font-size:18px;color:var(--red);}
  .stat span{font-size:11px;color:var(--muted);}
  .reg-item{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.04);}
  .reg-item .rt{font-size:13.5px;font-weight:700;color:#2b2320;}
  .reg-item .rd{font-size:11.5px;color:var(--muted);}
  .export-all{width:100%;background:#2f9e52;color:#fff;border:none;border-radius:14px;padding:13px;font-weight:700;margin-top:6px;cursor:pointer;}
  .empty-block{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;}

  .partner-card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.05);}
  .partner-card h4{margin:0 0 8px;font-size:15px;color:#2b2320;}
  .perk-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px dashed #eee;color:#5a4f49;}
  .perk-row b{color:var(--red);}
</style>
</head>

<div id="splash">

const PARTNERS = [
  {name:"Спортмастер",perks:[["Бронза","−5% на экипировку"],["Серебро","−12% на экипировку"],["Золото","−20% + бесплатная доставка"]]},
  {name:"Decathlon",perks:[["Бронза","−5% на инвентарь"],["Серебро","−10% на инвентарь"],["Золото","−15% + подарок"]]},
  {name:"Спортивное питание",perks:[["Бронза","−5% на протеин"],["Серебро","−12%"],["Золото","−20% + бесплатная доставка"]]},
  {name:"DDX Fitness",perks:[["Бронза","Гостевой визит"],["Серебро","−20% на абонемент"],["Золото","Бесплатный месяц абонемента"]]}
];

const CATEGORIES = ["Все", ...Array.from(new Set(EVENTS.map(e=>e.cat)))];

const LS_KEY = "muv_registered_v2";
function getRegistered(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||[];}catch(e){return [];} }
function setRegistered(arr){ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
let registered = getRegistered();
if(registered.length===0){ registered=["e1","e4"]; setRegistered(registered); }

window.addEventListener("load", ()=>{
  if(navigator.vibrate){ try{ navigator.vibrate([25,40,25]); }catch(e){} }
  setTimeout(()=>{ document.getElementById("splash").classList.add("hide"); }, 1600);
});

let activeCat = "Все";
function renderCats(){
  const row = document.getElementById("catsRow");
  row.innerHTML = "";
  CATEGORIES.forEach(cat=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (cat===activeCat ? " active":"");
    chip.textContent = cat;
    chip.onclick = ()=>{ activeCat = cat; renderCats(); renderEvents(); };
    row.appendChild(chip);
  });
}

function fmtDate(startISO,endISO){
  const s = new Date(startISO+"T00:00:00"), e = new Date(endISO+"T00:00:00");
  const months=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  if(startISO===endISO) return `${s.getDate()} ${months[s.getMonth()]}`;
  if(s.getMonth()===e.getMonth()) return `${s.getDate()}–${e.getDate()} ${months[s.getMonth()]}`;
  return `${s.getDate()} ${months[s.getMonth()]} – ${e.getDate()} ${months[e.getMonth()]}`;
}
function renderEvents(){
  const list = document.getElementById("eventsList");
  list.innerHTML = "";
  const filtered = EVENTS.filter(e=> activeCat==="Все" || e.cat===activeCat)
                          .sort((a,b)=> a.start.localeCompare(b.start));
  filtered.forEach(ev=>{
    const isReg = registered.includes(ev.id);
    const card = document.createElement("div");
    card.className="card"; card.id="card-"+ev.id;
    card.innerHTML = `
      <div class="card-cover" style="background:${COVER_GRADIENTS[ev.cat]||'linear-gradient(135deg,#7a1f2b,#b23a3a)'}">
        <div class="tag">${ev.cat}</div>
        <div class="date">${fmtDate(ev.start,ev.end)}</div>
      </div>
      <div class="card-body">
        <h3>${ev.title}</h3>
        <div class="card-loc">📍 ${ev.loc}</div>
        <div class="card-tags">${ev.tags.map(t=>`<span class="mini-tag">${t}</span>`).join("")}</div>
        <div class="card-actions">
          <button class="btn-primary ${isReg?'done':''}" data-id="${ev.id}">${isReg?'Вы участвуете':'Зарегистрироваться'}</button>
          ${isReg?`<button class="btn-cal" data-id="${ev.id}" title="Добавить в календарь">🗓️</button>`:""}
          <button class="btn-icon" data-info="${ev.id}">ℹ️</button>
        </div>
        ${!ev.verified?'<div class="demo-note">Демо-данные, точные даты уточняются организаторами.</div>':''}
      </div>`;
    list.appendChild(card);
  });

  list.querySelectorAll(".btn-primary").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.id;
      if(registered.includes(id)){
        registered = registered.filter(x=>x!==id);
      } else {
        registered.push(id);
        if(navigator.vibrate){ try{navigator.vibrate(15);}catch(e){} }
      }
      setRegistered(registered);
      renderEvents(); renderMiniCal(); renderProfile();
    };
  });
  list.querySelectorAll(".btn-cal").forEach(btn=>{
    btn.onclick = ()=> exportICS(EVENTS.find(e=>e.id===btn.dataset.id));
  });
  list.querySelectorAll(".btn-icon").forEach(btn=>{
    btn.onclick = ()=>{
      const ev = EVENTS.find(e=>e.id===btn.dataset.info);
      alert(ev.title+"\n\n"+ev.desc+"\n\n📍 "+ev.loc);
    };
  });
}

let calYear = 2026, calMonth = 8;
function renderMiniCal(){
  const wrap = document.getElementById("miniCal");
  const monthNames=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  const first = new Date(calYear, calMonth, 1);
  const startDow = (first.getDay()+6)%7;
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayISO = "2026-09-22";

  const eventDates = {};
  EVENTS.forEach(ev=>{
    if(!registered.includes(ev.id)) return;
    let d = new Date(ev.start+"T00:00:00"); const end = new Date(ev.end+"T00:00:00");
    while(d<=end){ eventDates[d.toISOString().slice(0,10)] = ev; d.setDate(d.getDate()+1); }
  });

  let cellsHtml = "";
  ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"].forEach(d=>cellsHtml+=`<div class="dow">${d}</div>`);
  for(let i=0;i<startDow;i++) cellsHtml += `<div class="mini-cal-day empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const hasEvent = !!eventDates[iso];
    const isToday = iso===todayISO;
    cellsHtml += `<div class="mini-cal-day ${hasEvent?'has-event':''} ${isToday?'today':''}" data-date="${iso}">${day}${hasEvent?'<span class="dot"></span>':''}</div>`;
  }

  wrap.innerHTML = `
    <div class="mini-cal-head">
      <div class="mini-cal-nav"><button id="calPrev">‹</button></div>
      <b>${monthNames[calMonth]} ${calYear}</b>
      <div class="mini-cal-nav"><button id="calNext">›</button></div>
    </div>
    <div class="mini-cal-grid">${cellsHtml}</div>
    ${Object.keys(eventDates).length===0?'<div class="mini-cal-empty">Нет запланированных событий — зарегистрируйтесь на ивент, чтобы увидеть его здесь</div>':''}
  `;
  document.getElementById("calPrev").onclick=()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderMiniCal(); };
  document.getElementById("calNext").onclick=()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderMiniCal(); };
  wrap.querySelectorAll(".mini-cal-day.has-event").forEach(cell=>{
    cell.onclick=()=>{
      const ev = eventDates[cell.dataset.date];
      const target = document.getElementById("card-"+ev.id);
      if(target){ activeCat="Все"; renderCats(); renderEvents(); setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"center"}),50); }
    };
  });
}

function icsDate(iso){ return iso.replace(/-/g,"") + "T090000"; }
function icsEndDate(iso){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+1); return d.toISOString().slice(0,10).replace(/-/g,"")+"T090000"; }
function buildICSBlock(ev){
  return [
    "BEGIN:VEVENT",
    "UID:"+ev.id+"@muv-app.local",
    "DTSTART:"+icsDate(ev.start),
    "DTEND:"+icsEndDate(ev.end),
    "SUMMARY:"+ev.title,
    "LOCATION:"+ev.loc,
    "DESCRIPTION:"+ev.desc.replace(/\n/g," "),
    "END:VEVENT"
  ].join("\r\n");
}
function downloadBlob(content, filename){
  const blob = new Blob([content], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportICS(ev){
  const ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MUV//RU\r\n"+buildICSBlock(ev)+"\r\nEND:VCALENDAR";
  downloadBlob(ics, ev.title.replace(/[^a-zA-Zа-яА-Я0-9]+/g,"_")+".ics");
}
function exportAllICS(){
  const list = EVENTS.filter(e=>registered.includes(e.id));
  if(list.length===0){ alert("У вас пока нет регистраций на события."); return; }
  const body = list.map(buildICSBlock).join("\r\n");
  const ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MUV//RU\r\n"+body+"\r\nEND:VCALENDAR";
  downloadBlob(ics, "MUV_moi_sobytiya.ics");
}
document.getElementById("exportAllBtn").onclick = exportAllICS;

function renderPartners(){
  const wrap = document.getElementById("partnersList");
  wrap.innerHTML = PARTNERS.map(p=>`
    <div class="partner-card">
      <h4>${p.name}</h4>
      ${p.perks.map(pr=>`<div class="perk-row"><span>${pr[0]}</span><b>${pr[1]}</b></div>`).join("")}
    </div>
  `).join("");
}

function getLevel(count){
  if(count>=10) return {name:"Золото",cls:"level-gold"};
  if(count>=6) return {name:"Серебро",cls:"level-silver"};
  return {name:"Бронза",cls:"level-bronze"};
}
function renderProfile(){
  const count = registered.length;
  const level = getLevel(count);
  document.getElementById("levelBadgeWrap").innerHTML = `<div class="level-badge ${level.cls}">Уровень: ${level.name}</div>`;
  document.getElementById("statsRow").innerHTML = `
    <div class="stat"><b>${count}</b><span>Регистраций</span></div>
    <div class="stat"><b>${Math.max(0,10-count)}</b><span>До золота</span></div>
    <div class="stat"><b>${new Set(EVENTS.filter(e=>registered.includes(e.id)).map(e=>e.cat)).size}</b><span>Видов спорта</span></div>
  `;
  const regWrap = document.getElementById("regList");
  const regEvents = EVENTS.filter(e=>registered.includes(e.id)).sort((a,b)=>a.start.localeCompare(b.start));
  if(regEvents.length===0){
    regWrap.innerHTML = `<div class="empty-block">Пока нет регистраций.<br>Найдите событие на вкладке «События».</div>`;
    return;
  }
  regWrap.innerHTML = regEvents.map(ev=>`
    <div class="reg-item">
      <div><div class="rt">${ev.title}</div><div class="rd">${fmtDate(ev.start,ev.end)} · ${ev.loc}</div></div>
      <button class="btn-cal" data-id="${ev.id}">🗓️</button>
    </div>
  `).join("");
  regWrap.querySelectorAll(".btn-cal").forEach(btn=>{
    btn.onclick = ()=> exportICS(EVENTS.find(e=>e.id===btn.dataset.id));
  });
}

document.querySelectorAll(".nav-item").forEach(item=>{
  item.onclick = ()=>{
    document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    item.classList.add("active");
    document.getElementById("page-"+item.dataset.page).classList.add("active");
    document.getElementById("scrollArea").scrollTop = 0;
    if(navigator.vibrate){ try{navigator.vibrate(10);}catch(e){} }
  };
});

renderCats();
renderEvents();
renderMiniCal();
renderPartners();
renderProfile();
</script>
